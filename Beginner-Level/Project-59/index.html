<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-classic">

  <div class="theme-picker">
    <button class="theme-btn active" data-theme="theme-classic">Classic</button>
    <button class="theme-btn" data-theme="theme-minimal">Minimal</button>
    <button class="theme-btn" data-theme="theme-dark">Dark</button>
    <button class="theme-btn" data-theme="theme-gradient">Gradient</button>
    <button class="theme-btn" data-theme="theme-neon">Neon</button>
  </div>

  <div class="container">
    <h1>Password Generator</h1>

    <div class="output-row">
      <input type="text" id="passwordOutput" readonly placeholder="Your password will appear here">
      <button id="copyBtn" title="Copy to clipboard">📋</button>
    </div>
    <p class="copy-msg" id="copyMsg"></p>

    <div class="strength-track">
      <div class="strength-fill" id="strengthFill"></div>
    </div>
    <p class="strength-label" id="strengthLabel">Strength: -</p>

    <div class="option-row">
      <label for="lengthRange">Length: <span id="lengthValue">12</span></label>
      <input type="range" id="lengthRange" min="4" max="32" value="12">
    </div>

    <div class="checkbox-group">
      <label><input type="checkbox" id="optUpper" checked> Uppercase (A-Z)</label>
      <label><input type="checkbox" id="optLower" checked> Lowercase (a-z)</label>
      <label><input type="checkbox" id="optNumbers" checked> Numbers (0-9)</label>
      <label><input type="checkbox" id="optSymbols"> Symbols (!@#$%)</label>
    </div>

    <button id="generateBtn">Generate Password</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
