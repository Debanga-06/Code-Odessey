<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Validator</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-classic">

  <div class="theme-picker">
    <button class="theme-btn active" data-theme="theme-classic">Classic</button>
    <button class="theme-btn" data-theme="theme-minimal">Minimal</button>
    <button class="theme-btn" data-theme="theme-dark">Dark</button>
    <button class="theme-btn" data-theme="theme-gradient">Gradient</button>
    <button class="theme-btn" data-theme="theme-neon">Neon</button>
  </div>

  <div class="container">
    <h1>Email Validator</h1>

    <div class="input-row">
      <input type="text" id="emailInput" placeholder="Enter an email address">
      <span class="status-icon" id="statusIcon"></span>
    </div>

    <p class="feedback-msg" id="feedbackMsg">Start typing to check your email</p>

    <ul class="rules-list" id="rulesList">
      <li id="ruleAt">Contains an @ symbol</li>
      <li id="ruleDomain">Has a valid domain (e.g. gmail.com)</li>
      <li id="ruleNoSpaces">No spaces</li>
      <li id="ruleChars">Only allowed characters before @</li>
    </ul>

    <button id="checkBtn">Validate Email</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
