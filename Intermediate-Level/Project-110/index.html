<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Recipe Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">

  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">🍲 Recipe<span>Finder</span></h1>

      <div class="theme-switcher">
        <button class="theme-btn" data-theme="dark" title="Dark theme">🌙</button>
        <button class="theme-btn" data-theme="light" title="Light theme">☀️</button>
        <button class="theme-btn" data-theme="retro" title="Retro theme">📼</button>
      </div>
    </div>
  </header>

  <main class="app-main">

    <section class="search-section">
      <form id="search-form" class="search-form" autocomplete="off">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search by name (e.g. Arrabiata) or ingredient (e.g. chicken)..."
        />
        <button type="submit" class="search-btn">Search</button>
      </form>

      <div class="mode-row">
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="name">By Name</button>
          <button class="mode-btn" data-mode="ingredient">By Ingredient</button>
        </div>
        <button id="surprise-btn" class="surprise-btn">🎲 Surprise Me</button>
      </div>

      <div class="category-row" id="category-row"></div>
    </section>

    <section class="status-section" id="status-section">
      <p class="status-message" id="status-message">Search a dish name, an ingredient, or hit Surprise Me 🍽️</p>
    </section>

    <section class="results-section">
      <div class="results-grid" id="results-grid"></div>
    </section>

    <section class="favorites-section">
      <h2 class="favorites-title">Saved Recipes</h2>
      <div class="favorites-row" id="favorites-row"></div>
    </section>

  </main>

  <!-- Recipe details modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Recipe Finder | Data from TheMealDB</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
